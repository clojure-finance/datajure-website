<nav class="pager" aria-label="Previous and next page">
    {% if prev %}
    <a class="pager-link prev" href="{{prev.uri}}"><span class="pager-label">&larr; Previous</span><span class="pager-title">{{prev.title}}</span></a>
    {% else %}
    <span></span>
    {% endif %}
    {% if next %}
    <a class="pager-link next" href="{{next.uri}}"><span class="pager-label">Next &rarr;</span><span class="pager-title">{{next.title}}</span></a>
    {% endif %}
</nav>
