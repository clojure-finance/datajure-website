name: Publish
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Build the Cryogen site and deploy it to gh-pages.
      - name: Deploy
        uses: clojure-finance/cryogen-action@v3
        with:
          folder: public/datajure-website
          java-version: '21' # optional
          java-distribution: 'liberica' # optional
          branch: gh-pages # optional
          single-commit: yes # optional
